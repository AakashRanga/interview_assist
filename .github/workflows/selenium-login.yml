name: Selenium E2E Testing

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/selenium-login.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/selenium-login.yml'

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Selenium test dependencies
        working-directory: ./frontend/selenium-tests
        run: npm ci

        

      - name: Create test-results directory if it doesn't exist
        run: mkdir -p frontend/selenium-tests/test-results frontend/selenium-tests/reports

      - name: Run Selenium E2E tests
        working-directory: ./frontend/selenium-tests
        run: npm run candidate-e2e || true
        env:
          CI: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            frontend/selenium-tests/test-results/
            frontend/selenium-tests/reports/
          retention-days: 7