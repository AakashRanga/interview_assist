name: Selenium E2E Testing

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/selenium-login.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/selenium-login.yml'

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | awk '{print $2}' | cut -d'.' -f1)
          LATEST_CHROMEDRIVER=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_VERSION}")
          wget -q "https://chromedriver.storage.googleapis.com/${LATEST_CHROMEDRIVER}/chromedriver_linux64.zip" -O chromedriver.zip
          unzip -q chromedriver.zip
          sudo mv chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver
          rm chromedriver.zip

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Selenium test dependencies
        working-directory: ./frontend/selenium-tests
        run: npm ci

      - name: Start frontend dev server
        working-directory: ./frontend
        run: npm run dev &
        env:
          CI: true

      - name: Wait for server to be ready
        run: |
          echo "Waiting for frontend server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8189 > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            sleep 2
          done

      - name: Run Selenium E2E tests
        working-directory: ./frontend/selenium-tests
        run: npm run candidate-e2e
        env:
          CI: true

      - name: Upload test reports
        if: always()
        working-directory: ./frontend/selenium-tests
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            test-results/
            reports/
          retention-days: 7